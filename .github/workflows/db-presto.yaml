name: 'DB:Presto'
permissions: {}

on:
  workflow_call:
    secrets:
      BQ_PRESTO_TRINO_KEY:
        required: true

jobs:
  test-presto:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: workspace
      - name: Extract workspace
        run: tar --use-compress-program='zstd -d -T0' -xf workspace.tzst && rm workspace.tzst
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      # Building the slim image pulls the 9 GB official image; loading it from
      # the Actions cache takes seconds. presto_start.sh skips the build when
      # the image is present. Only push-to-main runs save, so an image built
      # from PR code never reaches a run on main.
      - name: Restore presto image
        id: presto-image
        uses: actions/cache/restore@v4
        with:
          path: /tmp/presto-slim.tar
          key: presto-slim-${{ hashFiles('test/presto/Dockerfile.slim', 'test/presto/presto_start.sh') }}
      - name: Load presto image
        if: steps.presto-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/presto-slim.tar
      - name: Start presto
        run: ./test/presto/presto_start.sh --slim
        env:
          BQ_CREDENTIALS_KEY: ${{ secrets.BQ_PRESTO_TRINO_KEY }}
      - name: Save presto image
        if: github.event_name == 'push' && steps.presto-image.outputs.cache-hit != 'true'
        run: docker save presto-slim -o /tmp/presto-slim.tar
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && steps.presto-image.outputs.cache-hit != 'true'
        with:
          path: /tmp/presto-slim.tar
          key: ${{ steps.presto-image.outputs.cache-primary-key }}
      - name: Test
        run: |
          npm run ci-presto
          ./test/presto/presto_stop.sh
        env:
          PRESTO_CATALOG: bigquery
          PRESTO_SCHEMA: malloytest
          PRESTO_HOST: http://localhost
          PRESTO_PORT: 8080
          PRESTO_USER: malloy-ci-bot@malloydata.org
