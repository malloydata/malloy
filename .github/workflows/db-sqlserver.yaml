name: 'DB:SQLServer'
permissions: {}

on: workflow_call

# The required CI for this experimental dialect. This is currently the
# expanding (we hope) subset of ci-sqlserver that is known to pass.
jobs:
  test-sqlserver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: workspace
      - name: Extract workspace
        run: tar --use-compress-program='zstd -d -T0' -xf workspace.tzst && rm workspace.tzst
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      - name: SQL Server Smoke test
        run: |
          bash test/mssql/mssql_start.sh
          npm run ci-sqlserver-smoketest
          bash test/mssql/mssql_stop.sh
        env:
          MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2017-latest
          MSSQL_HOST: localhost
          MSSQL_PORT: 1433
          MSSQL_USER: sa
          # The test rig's own login, the default mssql_start.sh gives the container
          MSSQL_PASSWORD: Malloy_Test_123
          MSSQL_DATABASE: malloytest
          MSSQL_TRUST_SERVER_CERTIFICATE: 'true'
