name: 'DB:SQLServer'
permissions: {}

# Manual while the dialect is experimental; run-tests.yaml does not call it.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-sqlserver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: workspace
      - name: Extract workspace
        run: tar --use-compress-program='zstd -d -T0' -xf workspace.tzst && rm workspace.tzst
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      - name: Test
        run: |
          bash test/mssql/mssql_start.sh
          npm run ci-sqlserver
          bash test/mssql/mssql_stop.sh
        env:
          MSSQL_HOST: localhost
          MSSQL_PORT: 1433
          MSSQL_USER: sa
          MSSQL_PASSWORD: Malloy_Test_123
          MSSQL_DATABASE: malloytest
