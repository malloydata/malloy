name: 'DB:SQLServer'
permissions: {}

on: workflow_call

# The smoke job of an experimental dialect: the dialect's own jest project,
# which must stay green, on the oldest supported server and the current one.
# The shared suite (ci-sqlserver) is run by hand until the dialect leaves
# experimental; see the Testing section of test/CONTEXT.md.
jobs:
  test-sqlserver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/mssql/server:2017-latest
          - mcr.microsoft.com/mssql/server:2022-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: workspace
      - name: Extract workspace
        run: tar --use-compress-program='zstd -d -T0' -xf workspace.tzst && rm workspace.tzst
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      - name: Smoke test
        run: |
          bash test/mssql/mssql_start.sh
          npm run ci-sqlserver-smoketest
          bash test/mssql/mssql_stop.sh
        env:
          MSSQL_IMAGE: ${{ matrix.image }}
          MSSQL_HOST: localhost
          MSSQL_PORT: 1433
          MSSQL_USER: sa
          # The test rig's own login, the default mssql_start.sh gives the container
          MSSQL_PASSWORD: Malloy_Test_123
          MSSQL_DATABASE: malloytest
          MSSQL_TRUST_SERVER_CERTIFICATE: 'true'
