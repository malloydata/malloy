# The hive catalog serves test/data/malloytest-parquet, mounted read-only
# under /data/malloytest, with the tables hive_ddl.ts declares. The file
# metastore lives inside the container.
connector.name=hive-hadoop2
hive.metastore=file
hive.metastore.catalog.dir=file:///tmp/hive-metastore
# Match parquet columns by name; presto's default is by position
hive.parquet.use-column-names=true
