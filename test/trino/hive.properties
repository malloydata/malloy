# The hive catalog serves test/data/malloytest-parquet, mounted read-only
# under /data/malloytest, with the tables hive_ddl.ts declares. The file
# metastore lives inside the container's own data directory, which the trino
# user can write; nothing but the parquet crosses the container boundary.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///trino/metastore
fs.native-local.enabled=true
local.location=/data
# The parquet timestamps are microseconds; the DDL declares TIMESTAMP(6)
hive.timestamp-precision=MICROSECONDS
